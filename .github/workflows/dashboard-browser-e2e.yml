name: Dashboard Browser Acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-acceptance:
    name: Enterprise SSO Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm --version | grep -q '^12\.' || npm i -g npm@12

      - uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install Python dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Enforce 12 GiB browser provisioning headroom
        shell: bash
        run: |
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | tail -n 1 | tr -s ' ' | cut -d ' ' -f 4)"
          required_kib=$((12 * 1024 * 1024))
          echo "Browser provisioning headroom: ${available_kib} KiB available; ${required_kib} KiB required"
          if (( available_kib < required_kib )); then
            echo "::error::Playwright provisioning requires at least 12 GiB free"
            exit 1
          fi

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run production dashboard browser acceptance
        working-directory: web
        env:
          CI: 'true'
          PYTHON: ../.venv/bin/python
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: npm run test:e2e

      - name: Enforce zero skipped auth flows
        if: success()
        working-directory: web
        run: |
          node -e "const r=require('./playwright-report/results.json'); if ((r.stats?.skipped ?? 0) !== 0) { console.error('Skipped critical auth flows:', r.stats.skipped); process.exit(1) }"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-playwright-report-${{ github.sha }}
          path: web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload screenshots, traces, and videos on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-playwright-results-${{ github.sha }}
          path: web/test-results
          retention-days: 14
          if-no-files-found: warn
