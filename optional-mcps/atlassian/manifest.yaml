# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: atlassian
description: >-
  Jira issues and Confluence pages via Atlassian's hosted remote MCP.
source: https://support.atlassian.com/rovo/docs/getting-started-with-the-atlassian-remote-mcp-server/

# Official vendor-hosted remote MCP (URL-only — Hermes never spawns a local
# process for this entry). The /authv2 endpoint publishes the OAuth metadata
# Hermes's MCP client needs for discovery, PKCE, token exchange, and refresh.
transport:
  type: http
  url: https://mcp.atlassian.com/v1/mcp/authv2

auth:
  type: oauth

# Keep the default agent surface to the Jira operations needed for a coding
# workflow. Users can inspect and change this selection after authentication.
tools:
  default_enabled:
    - getJiraIssue
    - searchJiraIssuesUsingJql
    - getTransitionsForJiraIssue
    - addCommentToJiraIssue
    - transitionJiraIssue

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - jira
    - confluence
    - atlassian
    - bitbucket
  hosts:
    - atlassian.net
    - atlassian.com
    - jira.com

post_install: |
  Run `hermes mcp login atlassian`, then approve the intended Atlassian
  site and Jira access. After authentication, run
  `hermes mcp configure atlassian` if the server's tool names changed,
  then start a fresh session or reload MCP tools.
